<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Assign looks to models</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.lbl{font-family:Inter,system-ui,sans-serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#6E6A64;margin:0}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:10px;font-family:Inter,system-ui,sans-serif;font-size:9px;letter-spacing:.1em;color:#6E6A64;background:none;border:0}
.tabb{flex:1;min-height:44px;border:0;border-bottom:2px solid transparent;background:none;font-family:Georgia,serif;font-size:16px;color:#6E6A64}
.pill{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #CFCAC4;background:transparent;font-family:Inter,system-ui,sans-serif;font-size:12px;color:#111}
.pillon{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #111;background:#111;font-family:Inter,system-ui,sans-serif;font-size:12px;color:#fff}
.chipd{padding:5px 10px;border-radius:999px;background:rgba(17,17,17,.7);color:#F5F2EE;font-size:11px;font-family:Inter,system-ui,sans-serif}
.seg{flex:1;min-height:44px;border:0;border-radius:8px;background:transparent;font-family:Georgia,serif;font-size:18px;color:#111}
.row{display:flex;align-items:center;gap:12px;min-height:60px;border-bottom:1px solid #E0DDD8}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; display: flex; flex-direction: column; background: #F5F2EE; font-family: Inter, system-ui, sans-serif; color: #111; overflow: hidden">
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 6px 8px; border-bottom: 1px solid #E0DDD8">
    <button aria-label="Back" style="width: 44px; height: 44px; border: 0; background: none; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
    <span style="flex: 1; font-family: Georgia, serif; font-size: 20px">Who gets which look</span><span style="font-size: 11px; color: #4A4743; padding-right: 8px">30 models</span>
  </div>
  <div style="flex-shrink: 0; display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto">
    <span style="flex-shrink: 0; padding: 8px 12px; border-radius: 999px; background: #111; color: #fff; font-size: 12px">A · 14</span>
    <span style="flex-shrink: 0; padding: 8px 12px; border-radius: 999px; border: 1px solid #CFCAC4; font-size: 12px">B · 9</span>
    <span style="flex-shrink: 0; padding: 8px 12px; border-radius: 999px; border: 1px solid #CFCAC4; font-size: 12px">C · 5</span>
    <span style="flex-shrink: 0; padding: 8px 12px; border-radius: 999px; border: 1px solid #A33D28; color: #A33D28; font-size: 12px">Not set · 2</span>
  </div>
  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px">
    <sc-for list="{{ models }}" as="m" hint-placeholder-count="8">
      <div class="row">
        <sc-if value="{{ m.img }}" hint-placeholder-val="{{ true }}"><img src="{{ m.img }}" alt="" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover"></sc-if>
        <sc-if value="{{ m.noImg }}" hint-placeholder-val="{{ false }}"><span style="width: 40px; height: 40px; border-radius: 50%; background: #E0DDD8; display: flex; align-items: center; justify-content: center; font-size: 11px">{{ m.ini }}</span></sc-if>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-family: Georgia, serif; font-size: 15px">{{ m.name }}</span><span style="font-size: 11px; color: #4A4743">Look {{ m.look }}</span></span>
        <div style="display: flex; gap: 2px; padding: 3px; border-radius: 8px; background: #E8E4DF">
          <sc-for list="{{ m.opts }}" as="o" hint-placeholder-count="3"><button style="width: 36px; height: 36px; border: 0; border-radius: 6px; background: {{ o.bg }}; color: {{ o.c }}; font-family: Georgia, serif; font-size: 15px">{{ o.l }}</button></sc-for>
        </div>
      </div>
    </sc-for>
  </div>
  <div style="flex-shrink: 0; padding: 12px 16px 16px; border-top: 1px solid #E0DDD8; display: flex; flex-direction: column; gap: 8px"><button style="width: 100%; min-height: 52px; border-radius: 8px; border: 0; background: #111; color: #fff; font-family: Inter, system-ui, sans-serif; font-size: 12px; letter-spacing: .12em">SAVE · ASSISTANTS SEE IT ON THEIR MODEL</button></div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const B = {"SA": "1705ea7146c2879258c52a172e2bdcbe", "ML": "92535a459422f9a2aeb42fee5cce377d", "AJ": "25da83555fcf1ca7fad82ae9a74e05c8", "AD": "2af75eeca89115daaf4090df5de1cc6c", "CD": "0145c19aa201167cced03e129ff8b0d5", "PS": "eb52f2831800e0153855e0ed84e447ed"};
    const raw = [['06','Mei Lin','ML','A'],['01','Sofia Andersen','SA','A'],['05','Aaliyah Jones','AJ','B'],['09','Priya Sharma','PS','C'],['11','Amara Diallo','AD','A'],['13','Camille Dubois','CD','B'],['14','Ingrid Strand','',''],['15','Yuki Nakamura','','']];
    const models = raw.map(([n,name,k,look]) => ({ name, img: k ? '/_blob/' + B[k] : '', noImg: !k, ini: name.split(' ').map(w=>w[0]).join(''), look: n + (look ? '' : ' · not set'), opts: ['A','B','C'].map(l => ({ l, bg: l === look ? '#111' : 'transparent', c: l === look ? '#fff' : '#111' })) }));
    return { models };
  }
}
</script>
</body>
</html>
