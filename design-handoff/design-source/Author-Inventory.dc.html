<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add product from inventory</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.lbl{font-family:Inter,system-ui,sans-serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#6E6A64;margin:0}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:10px;font-family:Inter,system-ui,sans-serif;font-size:9px;letter-spacing:.1em;color:#6E6A64;background:none;border:0}
.tabb{flex:1;min-height:44px;border:0;border-bottom:2px solid transparent;background:none;font-family:Georgia,serif;font-size:16px;color:#6E6A64}
.pill{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #CFCAC4;background:transparent;font-family:Inter,system-ui,sans-serif;font-size:12px;color:#111}
.pillon{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #111;background:#111;font-family:Inter,system-ui,sans-serif;font-size:12px;color:#fff}
.chipd{padding:5px 10px;border-radius:999px;background:rgba(17,17,17,.7);color:#F5F2EE;font-size:11px;font-family:Inter,system-ui,sans-serif}
.seg{flex:1;min-height:44px;border:0;border-radius:8px;background:transparent;font-family:Georgia,serif;font-size:18px;color:#111}
.row{display:flex;align-items:center;gap:12px;min-height:60px;border-bottom:1px solid #E0DDD8}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; display: flex; flex-direction: column; background: #F5F2EE; font-family: Inter, system-ui, sans-serif; color: #111; overflow: hidden">
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 6px 8px; border-bottom: 1px solid #E0DDD8">
    <button aria-label="Back" style="width: 44px; height: 44px; border: 0; background: none; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
    <span style="flex: 1; font-family: Georgia, serif; font-size: 20px">Eyes · Look A</span>
  </div>
  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <p class="lbl">How it's done</p>
      <div style="position: relative">
        <textarea rows="6" style="width: 100%; box-sizing: border-box; padding: 12px 12px 48px; border: 1px solid #111; border-radius: 10px; background: #fff; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.5; resize: none; color: #111">Mascara is the whole look. Top and bottom lashes, build in layers, let it go thick and a little clumpy. No liner.</textarea>
        <button aria-label="Dictate" style="position: absolute; right: 8px; bottom: 8px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: #E8E4DF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0014 0M12 18v3"></path></svg></button>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <p class="lbl">Products (optional)</p>
      <div style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 8px 0 12px; border: 1px solid #E0DDD8; border-radius: 10px; background: #fff">
        <span style="width: 32px; height: 32px; border-radius: 50%; background: #111; border: 2px solid #E0DDD8; flex-shrink: 0"></span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 500">Volumizing mascara</span><span style="font-size: 11px; color: #4A4743">Shade: Blackest Black · in kit, 6 left</span></span>
        <button aria-label="Remove product" style="width: 40px; height: 40px; border: 0; background: none; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4A4743" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 8px 0 12px; border: 1px solid #E0DDD8; border-radius: 10px; background: #fff">
        <span style="width: 32px; height: 32px; border-radius: 50%; background: #2B2522; border: 2px solid #E0DDD8; flex-shrink: 0"></span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 500">Lower lash mascara</span><span style="font-size: 11px; color: #4A4743">Shade: Soft Black · specialty, 2 in kit</span></span>
        <button aria-label="Remove product" style="width: 40px; height: 40px; border: 0; background: none; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4A4743" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>
      <button style="min-height: 44px; border-radius: 10px; border: 1px dashed #8A8580; background: transparent; font-family: Inter, system-ui, sans-serif; font-size: 12px; color: #111">+ Add from inventory</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><p class="lbl">References</p><span style="font-size: 11px; color: #4A4743">From Look A's photos and clips</span></div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{ refs }}" as="r" hint-placeholder-count="8">
          <button style="position: relative; aspect-ratio: 1; padding: 0; border-radius: 8px; overflow: hidden; border: 0; background: #E0DDD8">
            <img src="{{ r.img }}" alt="" style="width: 100%; height: 100%; object-fit: cover; opacity: {{ r.op }}">
            <span style="position: absolute; right: 4px; top: 4px; width: 20px; height: 20px; border-radius: 50%; border: 2px solid #fff; background: {{ r.cb }}; display: flex; align-items: center; justify-content: center"><sc-if value="{{ r.on }}" hint-placeholder-val="{{ false }}"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if></span>
            <sc-if value="{{ r.tag }}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 4px; bottom: 4px; padding: 1px 5px; border-radius: 4px; background: rgba(17,17,17,.75); color: #fff; font-size: 9px">{{ r.tag }}</span></sc-if>
          </button>
        </sc-for>
      </div>
      <span style="font-size: 12px; color: #4A4743">Photos tagged Eyes are suggested first.</span>
    </div>
  </div>
  <div style="flex-shrink: 0; padding: 12px 16px 16px; border-top: 1px solid #E0DDD8; display: flex; flex-direction: column; gap: 8px"><button style="width: 100%; min-height: 52px; border-radius: 8px; border: 0; background: #111; color: #fff; font-family: Inter, system-ui, sans-serif; font-size: 12px; letter-spacing: .12em">SAVE EYES</button></div>

  <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.35)"></div>
  <div role="dialog" aria-label="Add from inventory" style="position: absolute; left: 0; right: 0; bottom: 0; height: 760px; background: #F5F2EE; border-radius: 16px 16px 0 0; display: flex; flex-direction: column">
    <button aria-label="Drag down to close" style="flex-shrink: 0; height: 28px; background: none; border: 0; display: flex; align-items: center; justify-content: center"><span style="width: 40px; height: 5px; border-radius: 3px; background: #B9B4AE"></span></button>
    <div style="flex-shrink: 0; padding: 0 16px 12px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid #E0DDD8">
      <div style="display: flex; align-items: baseline; justify-content: space-between"><span style="font-family: Georgia, serif; font-size: 22px">Add from inventory</span><span style="font-size: 11px; color: #4A4743">for Eyes · Look A</span></div>
      <label style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; background: #fff; border: 1px solid #E0DDD8; border-radius: 10px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E6A64" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        <input placeholder="Search product or shade" style="flex: 1; border: 0; outline: none; background: transparent; font-family: Inter, system-ui, sans-serif; font-size: 14px">
      </label>
      <div style="display: flex; gap: 8px; overflow-x: auto">
        <button class="pillon" style="flex-shrink: 0">Mascara</button><button class="pill" style="flex-shrink: 0">Liner</button><button class="pill" style="flex-shrink: 0">Shadow</button><button class="pill" style="flex-shrink: 0">Lashes</button><button class="pill" style="flex-shrink: 0">Brows</button>
      </div>
    </div>
    <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px">
      <sc-for list="{{ items }}" as="p" hint-placeholder-count="6">
        <label style="display: flex; align-items: center; gap: 12px; min-height: 68px; border-bottom: 1px solid #E0DDD8; cursor: pointer">
          <span style="width: 36px; height: 36px; border-radius: 50%; background: {{ p.sw }}; border: 2px solid #E0DDD8; flex-shrink: 0"></span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <span style="font-size: 14px; font-weight: 500">{{ p.name }}</span>
            <span style="font-size: 12px; color: #2E2C29">{{ p.shade }}</span>
            <span style="font-size: 11px; color: {{ p.sc }}">{{ p.stock }}</span>
          </span>
          <input type="checkbox" checked="{{ p.on }}" style="width: 22px; height: 22px; accent-color: #111">
        </label>
      </sc-for>
    </div>
    <div style="flex-shrink: 0; padding: 12px 16px 28px; border-top: 1px solid #E0DDD8">
      <button style="width: 100%; min-height: 52px; border-radius: 8px; border: 0; background: #111; color: #fff; font-family: Inter, system-ui, sans-serif; font-size: 12px; letter-spacing: .12em">ADD 2 TO EYES</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [
      ['Volumizing mascara','Blackest Black','#111','In kits · 6 left',1,0],
      ['Lower lash mascara','Soft Black','#2B2522','Specialty · 2 left, ask Aimi',1,0],
      ['Lengthening mascara','Black','#1A1A1A','In kits · 9 left',0,0],
      ['Lengthening mascara','Brown Black','#3B2A22','In kits · 4 left',0,0],
      ['Tubing mascara','Black','#141414','Out of stock',0,1],
      ['Clear lash gel','Clear','#EDEAE6','In kits · 7 left',0,0]
    ];
    const items = raw.map(([name,shade,sw,stock,on,out]) => ({ name, shade: 'Shade: ' + shade, sw, stock, on: !!on, sc: out ? '#A33D28' : '#4A4743' }));
    const B = {"SA": "1705ea7146c2879258c52a172e2bdcbe", "ML": "92535a459422f9a2aeb42fee5cce377d", "AJ": "25da83555fcf1ca7fad82ae9a74e05c8", "AD": "2af75eeca89115daaf4090df5de1cc6c", "CD": "0145c19aa201167cced03e129ff8b0d5", "PS": "eb52f2831800e0153855e0ed84e447ed"};
    const keys = [['AD','Eyes',1],['ML','Eyes',1],['AJ','Eyes',0],['SA','',0],['CD','',0],['PS','',0],['ML','',0],['AD','',0]];
    const refs = keys.map(([k,tag,on]) => ({ img: '/_blob/' + B[k], tag, on: !!on, cb: on ? '#111' : 'rgba(17,17,17,.2)', op: on ? 1 : .85 }));
    
    return { items, refs };
  }
}
</script>
</body>
</html>
