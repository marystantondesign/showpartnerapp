<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPad portrait, panel collapsed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.lbl{font-family:Inter,system-ui,sans-serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#6E6A64;margin:0}
.chip{font-family:Inter,system-ui,sans-serif;font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:4px 8px;color:#111;white-space:nowrap;justify-self:start}
.f{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid #CFCAC4;background:transparent;font-family:Inter,system-ui,sans-serif;font-size:12px;color:#111}
.fon{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid #111;background:#111;font-family:Inter,system-ui,sans-serif;font-size:12px;color:#fff}
.row{display:grid;grid-template-columns:28px 36px minmax(0,1.5fr) repeat(3,minmax(0,1fr)) minmax(0,1.3fr);align-items:center;column-gap:10px}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:#E8E4DF}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:#E8E4DF}
.lg{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#4A4743;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%}
.ib{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:flex;align-items:center;justify-content:center}
.chips{display:flex;gap:8px;overflow-x:auto;flex-wrap:nowrap}
.chips button{flex-shrink:0;white-space:nowrap}
.nm{font-family:Georgia,serif;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</helmet>
<div style="width: 820px; height: 1180px; display: flex; flex-direction: column; background: #F5F2EE; font-family: Inter, system-ui, sans-serif; color: #111; overflow: hidden">
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 16px; padding: 12px 24px; border-bottom: 1px solid #E0DDD8">
    <span style="font-family: Georgia, serif; font-size: 26px; white-space: nowrap">Valentino SS26</span>
    <span style="font-size: 12px; color: #4A4743; white-space: nowrap">Makeup · 3:45 PM</span>
    <span style="flex: 1"></span>
    <button style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #111; background: transparent; font-family: Inter, system-ui, sans-serif; font-size: 11px; letter-spacing: .08em; color: #111; display: flex; align-items: center; gap: 8px; white-space: nowrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:#111"><path d="M10 14a4 4 0 006 0l3-3a4 4 0 00-6-6l-1 1M14 10a4 4 0 00-6 0l-3 3a4 4 0 006 6l1-1"></path></svg>SHARE STATUS LINK</button>
    <img src="/_blob/0a3feb4a34854d1403d19aea4f3cb43c" alt="Jen Zambrano" style="width: 36px; height: 36px; border-radius: 50%; object-fit: cover">
  </div>
  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column">
    <div style="flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; padding: 16px 24px 0">
      <div style="flex-shrink: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
        <div style="background: #111; color: #F5F2EE; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0">
          <p class="lbl" style="color: #C9C4BE; white-space: nowrap">Fully ready</p>
          <span style="font-family: Georgia, serif; font-size: 30px; line-height: 1; white-space: nowrap">8<span style="font-size: 15px; color: #C9C4BE"> /30</span></span>
          <div class="bar" style="background: #3A3734"><span style="width: 26.7%; background: #7A9E7E"></span></div>
        </div>
        <sc-for list="{{ svc }}" as="s" hint-placeholder-count="3">
          <div style="background: #fff; border: 1px solid #E0DDD8; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0">
            <p class="lbl" style="white-space: nowrap">{{ s.name }} done</p>
            <span style="font-family: Georgia, serif; font-size: 30px; line-height: 1; white-space: nowrap">{{ s.done }}<span style="font-size: 15px; color: #6E6A64"> /30</span></span>
            <div class="bar"><span style="width: {{ s.dw }}; background: #7A9E7E"></span><span style="width: {{ s.iw }}; background: #D4A853"></span><span style="width: {{ s.pw }}; background: #8A9BB0"></span></div>
            <div style="display: flex; flex-wrap: wrap; column-gap: 10px; row-gap: 2px">
              <sc-for list="{{ s.parts }}" as="p" hint-placeholder-count="2"><span class="lg"><span class="dot" style="background: {{ p.c }}"></span>{{ p.t }}</span></sc-for>
            </div>
          </div>
        </sc-for>
      </div>
      <div class="chips" style="flex-shrink: 0; padding: 14px 0 6px">
        <button class="fon">All 30</button><button class="f">Needs attention 2</button><button class="f">Not arrived 3</button><button class="f">Not paired 1</button><button class="f">Ready 8</button>
      </div>
      <div style="flex: 1; min-height: 0; overflow-y: auto">
        <div style="display: grid; grid-template-columns: 40px 40px minmax(0, 1fr) 104px 104px 104px minmax(0, 0.8fr); column-gap: 10px; align-items: center; position: sticky; top: 0; background: #F5F2EE; padding: 8px 0; border-bottom: 1px solid #CFCAC4"><span class="lbl">Look</span><span></span><span class="lbl">Model</span><span class="lbl">Hair</span><span class="lbl">Makeup</span><span class="lbl">Nails</span><span class="lbl">Assistant</span></div>
        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="10">
          <div style="display: grid; grid-template-columns: 40px 40px minmax(0, 1fr) 104px 104px 104px minmax(0, 0.8fr); column-gap: 10px; align-items: center; min-height: 60px; border-bottom: 1px solid #E0DDD8">
            <span style="font-size: 12px; color: #4A4743">{{ r.look }}</span>
            <sc-if value="{{ r.img }}" hint-placeholder-val="{{ true }}"><img src="{{ r.img }}" alt="" style="width: 36px; height: 36px; border-radius: 50%; object-fit: cover"></sc-if>
            <sc-if value="{{ r.noImg }}" hint-placeholder-val="{{ false }}"><span style="width: 36px; height: 36px; border-radius: 50%; background: #E0DDD8; display: flex; align-items: center; justify-content: center; font-size: 11px">{{ r.ini }}</span></sc-if>
            <span style="display: flex; align-items: center; gap: 8px; min-width: 0"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0"><span class="nm">{{ r.name }}</span><span class="sub" style="color: {{ r.nc }}">{{ r.note }}</span></span></span>
            <span class="chip" style="background: {{ r.h.c }}">{{ r.h.t }}</span>
            <span class="chip" style="background: {{ r.m.c }}">{{ r.m.t }}</span>
            <span class="chip" style="background: {{ r.n.c }}">{{ r.n.t }}</span>
            <sc-if value="{{ r.np }}" hint-placeholder-val="{{ true }}"><span class="sub" style="font-size: 12px; color: #4A4743">{{ r.who }}</span></sc-if>
            <sc-if value="{{ r.pair }}" hint-placeholder-val="{{ false }}"><button style="justify-self: start; min-height: 36px; padding: 0 14px 0 10px; border-radius: 999px; border: 0; background: #111; color: #fff; font-family: Inter, system-ui, sans-serif; font-size: 10px; font-weight: 600; letter-spacing: .1em">+ PAIR</button></sc-if>
          </div>
        </sc-for>
      </div>
    </div>
    <div style="flex-shrink: 0; border-top: 1px solid #E0DDD8; background: #fff; box-shadow: 0 -6px 18px rgba(0,0,0,.06); display: flex; flex-direction: column; padding-bottom: 16px">
      <div role="separator" aria-orientation="horizontal" aria-label="Drag to resize panel" style="flex-shrink: 0; height: 24px; display: flex; align-items: center; justify-content: center; cursor: row-resize"><span style="width: 44px; height: 5px; border-radius: 3px; background: #B9B4AE"></span></div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 0 24px">
        <div style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; border-radius: 10px; background: #111; color: #fff; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E8C77A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:#E8C77A"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg><span style="font-size: 13px; font-weight: 600">Walkthrough 4:00</span><span style="font-size: 12px; color: #E8C77A">in 15 min</span></div>
        <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 12px; font-weight: 600; white-space: nowrap">15 min warning sent</span><span style="font-size: 11px; color: #4A4743; white-space: nowrap">22 got it · 4 waiting</span></div>
        <span style="flex: 1"></span>
        <button style="min-height: 48px; padding: 0 16px; border-radius: 8px; border: 1px solid #CFCAC4; background: transparent; font-family: Inter, system-ui, sans-serif; font-size: 11px; letter-spacing: .1em; color: #111; white-space: nowrap">ANNOUNCE</button>
        <button style="min-height: 48px; padding: 0 16px; border-radius: 8px; border: 0; background: #111; color: #fff; font-family: Inter, system-ui, sans-serif; font-size: 11px; letter-spacing: .1em; white-space: nowrap">START WALKTHROUGH</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":820,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    const S = { ns:{c:'#E8E4DF',t:'Not started'}, ip:{c:'#D4A853',t:'In progress'}, pa:{c:'#8A9BB0',t:'Paused'}, nr:{c:'#C4614A',t:'Revisit'}, dn:{c:'#7A9E7E',t:'Done'} };
    const pct = n => (n / 30 * 100).toFixed(1) + '%';
    const svc = [['Hair',14,9,2],['Makeup',17,8,0],['Nails',9,6,0]].map(([name,done,ip,pa]) => ({ name, done, dw: pct(done), iw: pct(ip), pw: pct(pa), parts: [[ip,'in progress','#D4A853'],[pa,'paused','#8A9BB0'],[30-done-ip-pa,'not started','#CFCAC4']].filter(x => x[0] > 0).map(([n,l,c]) => ({ t: n + ' ' + l, c })) }));
    const raw = [
      ['01','Sofia Andersen','SA','Makeup flagged by Jen','dn','nr','ip','Ivana R'],
      ['05','Aaliyah Jones','AJ','Ready','dn','dn','dn','Sofia R'],
      ['06','Mei Lin','ML','Arrived 2:52','pa','ip','ns','Sofia R'],
      ['09','Priya Sharma','PS','Not arrived · ETA 3:55','ns','ns','ns',''],
      ['11','Amara Diallo','AD','Arrived 2:55','ip','ip','ns','Tomás V'],
      ['13','Camille Dubois','CD','Arrived 2:40','dn','ip','dn','Kenji W'],
      ['14','Ingrid Strand','','Arrived 2:31','dn','dn','ip','Mira P'],
      ['15','Yuki Nakamura','','Arrived 3:44','ns','ns','ns','PAIR'],
      ['16','Valentina Cruz','','Arrived 2:58','ip','dn','ns','Carmen R'],
      ['17','Cassidy Martin','','Arrived 3:02','pa','ip','ns','Aisha J'],
      ['18','Neville Williams','','Arrived 3:05','ns','ip','ns','Benji A']
    ];
    const B = {"SA": "1705ea7146c2879258c52a172e2bdcbe", "ML": "92535a459422f9a2aeb42fee5cce377d", "AJ": "25da83555fcf1ca7fad82ae9a74e05c8", "AD": "2af75eeca89115daaf4090df5de1cc6c", "CD": "0145c19aa201167cced03e129ff8b0d5", "PS": "eb52f2831800e0153855e0ed84e447ed", "JZ": "0a3feb4a34854d1403d19aea4f3cb43c"};
    const rows = raw.map(([look,name,k,note,h,m,n,who]) => ({ look, name, img: k ? '/_blob/' + B[k] : '', noImg: !k, ini: name.split(' ').map(w=>w[0]).join(''), note, nc: note.startsWith('Makeup flagged') || note.startsWith('Not arrived') ? '#A33D28' : '#4A4743', h:S[h], m:S[m], n:S[n], who: who === 'PAIR' ? '' : (who || '—'), pair: who === 'PAIR', np: who !== 'PAIR', wsep: who ? ' · ' : '', who2: who === 'PAIR' ? 'Not paired' : who }));
    const tl = [['1:30 PM','Demo','Done','past'],['4:00 PM','Walkthrough','in 15 min','next'],['4:30 PM','Models back','','fut'],['5:00 PM','Dressing','','fut'],['6:00 PM','Show','','fut']];
    const timeline = tl.map(([time,label,state,k]) => ({ time, label, state, bg: k==='next' ? '#111' : 'transparent', tc: k==='next' ? '#fff' : (k==='past' ? '#6E6A64' : '#111'), sc: k==='next' ? '#E8C77A' : '#6E6A64', w: k==='next' ? 600 : 400 }));
    return { svc, rows, timeline };
  }
}
</script>
</body>
</html>
