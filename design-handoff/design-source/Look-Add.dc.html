<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Studio, add to Look A</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
.lbl{font-family:Inter,system-ui,sans-serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#6E6A64;margin:0}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:10px;font-family:Inter,system-ui,sans-serif;font-size:9px;letter-spacing:.1em;color:#6E6A64;background:none;border:0}
.tabb{flex:1;min-height:44px;border:0;border-bottom:2px solid transparent;background:none;font-family:Georgia,serif;font-size:16px;color:#6E6A64}
.pill{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #CFCAC4;background:transparent;font-family:Inter,system-ui,sans-serif;font-size:12px;color:#111}
.pillon{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #111;background:#111;font-family:Inter,system-ui,sans-serif;font-size:12px;color:#fff}
.chipd{padding:5px 10px;border-radius:999px;background:rgba(17,17,17,.7);color:#F5F2EE;font-size:11px;font-family:Inter,system-ui,sans-serif}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; display: flex; flex-direction: column; background: #F5F2EE; font-family: Inter, system-ui, sans-serif; color: #111; overflow: hidden">
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 6px 8px 0">
    <button aria-label="Back to looks" style="width: 44px; height: 44px; border: 0; background: none; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
    <span style="flex: 1; font-family: Georgia, serif; font-size: 22px">Look A</span>
    <span style="font-size: 11px; color: #4A4743; padding-right: 8px">14 models</span>
  </div>
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 16px 10px; font-size: 12px; color: #4A4743"><img src="/_blob/92535a459422f9a2aeb42fee5cce377d" alt="" style="width: 22px; height: 22px; border-radius: 50%; object-fit: cover">Mei Lin gets this look · captured by Sofia R, Lena S</div>
  <div style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column">
    <div style="position: relative; flex-shrink: 0; height: 360px; background: #111">
      <img src="/_blob/1705ea7146c2879258c52a172e2bdcbe" alt="Demo" style="width: 100%; height: 100%; object-fit: cover; opacity: .8">
      <span class="chipd" style="position: absolute; left: 12px; top: 12px">Full demo · Yadim and Aimi</span>
      <span class="chipd" style="position: absolute; right: 12px; top: 12px">1 / {{ total }}</span>
      <button aria-label="Play" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 68px; height: 68px; border-radius: 50%; border: 0; background: rgba(245,242,238,.92); display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="#111" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></button>
      <span style="position: absolute; left: 12px; bottom: 12px; font-size: 11px; color: #F5F2EE">4:12 · tap to play full screen</span>
    </div>
    <div style="flex-shrink: 0; display: flex; gap: 8px; padding: 10px 16px; overflow-x: auto">
      <sc-for list="{{ thumbs }}" as="t" hint-placeholder-count="6">
        <button style="position: relative; flex-shrink: 0; width: 60px; height: 60px; padding: 0; border-radius: 8px; overflow: hidden; border: {{ t.bd }}; background: #E0DDD8">
          <img src="{{ t.img }}" alt="" style="width: 100%; height: 100%; object-fit: cover">
          <sc-if value="{{ t.vid }}" hint-placeholder-val="{{ false }}"><span style="position: absolute; right: 4px; bottom: 4px; width: 16px; height: 16px; border-radius: 50%; background: rgba(17,17,17,.75); display: flex; align-items: center; justify-content: center"><svg width="8" height="8" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></span></sc-if>
          <sc-if value="{{ t.isnew }}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 4px; top: 4px; padding: 1px 5px; border-radius: 4px; background: #111; color: #fff; font-size: 9px; letter-spacing: .08em">NEW</span></sc-if>
        </button>
      </sc-for>
    </div>
    <div style="padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 14px">
      <button style="min-height: 48px; border-radius: 8px; border: 1px solid #111; background: transparent; font-family: Inter, system-ui, sans-serif; font-size: 11px; letter-spacing: .1em; color: #111; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>ADD PHOTO OR VIDEO</button>
      <p class="lbl" style="padding-top: 6px">By area</p>
      <sc-for list="{{ areas }}" as="a" hint-placeholder-count="5">
        <div style="display: flex; flex-direction: column; gap: 4px; padding-bottom: 12px; border-bottom: 1px solid #E0DDD8">
          <span style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-family: Georgia, serif; font-size: 17px">{{ a.name }}</span><span style="font-size: 11px; color: #4A4743">{{ a.count }}</span></span>
          <span style="font-size: 13px; line-height: 1.45; color: #2E2C29">{{ a.note }}</span>
        </div>
      </sc-for>
    </div>
  </div>
  <nav style="flex-shrink: 0; height: 72px; display: flex; border-top: 1px solid #E0DDD8; background: #F5F2EE; opacity: 1">
    <button class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"></path></svg>HOME</button>
    <button class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h14"></path></svg>MGMT</button>
    <button class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="4" y="4" width="7" height="7"></rect><rect x="13" y="4" width="7" height="7"></rect><rect x="4" y="13" width="7" height="7"></rect><rect x="13" y="13" width="7" height="7"></rect></svg>LINEUP</button>
    <button class="tab" style="color: #111111"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3"></circle></svg><span style="color: #2e2c29">STUDIO</span></button>
    <button class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 3v3M12 18v3M3 12h3M18 12h3"></path></svg>SETTINGS</button>
  </nav>  <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.35)"></div>
  <div role="dialog" aria-label="Add to Look A" style="position: absolute; left: 0; right: 0; bottom: 0; background: #F5F2EE; border-radius: 16px 16px 0 0; display: flex; flex-direction: column; padding-bottom: 28px">
    <button aria-label="Drag down to close" style="height: 28px; background: none; border: 0; display: flex; align-items: center; justify-content: center"><span style="width: 40px; height: 5px; border-radius: 3px; background: #B9B4AE"></span></button>
    <div style="padding: 0 16px 16px"><span style="font-family: Georgia, serif; font-size: 22px">Add to Look A</span></div>
    <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 10px">
      <button style="display: flex; align-items: center; gap: 14px; min-height: 72px; padding: 0 16px; border-radius: 12px; border: 1px solid #CFCAC4; background: #fff; text-align: left; font-family: Inter, system-ui, sans-serif; color: #111"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">Take photo or video</span><span style="font-size: 12px; color: #4A4743">Opens the camera, everything you shoot goes to Look A</span></span></button>
      <button style="display: flex; align-items: center; gap: 14px; min-height: 72px; padding: 0 16px; border-radius: 12px; border: 1px solid #CFCAC4; background: #fff; text-align: left; font-family: Inter, system-ui, sans-serif; color: #111"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="M4 16l5-5 4 4 3-3 4 4"></path></svg><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">Choose from camera roll</span><span style="font-size: 12px; color: #4A4743">For anything you already shot during the demo</span></span></button>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const B = {"SA": "1705ea7146c2879258c52a172e2bdcbe", "ML": "92535a459422f9a2aeb42fee5cce377d", "AJ": "25da83555fcf1ca7fad82ae9a74e05c8", "AD": "2af75eeca89115daaf4090df5de1cc6c", "CD": "0145c19aa201167cced03e129ff8b0d5", "PS": "eb52f2831800e0153855e0ed84e447ed"};
    const order = [["SA", true, false], ["ML", false, false], ["AJ", false, false], ["AD", true, false], ["CD", false, false], ["PS", false, false], ["ML", false, false]];
    const thumbs = order.map((o,i) => ({ img: '/_blob/' + B[o[0]], vid: o[1], isnew: o[2], bd: i === 0 ? '2px solid #111' : '2px solid transparent' }));
    const areas = [
      ['Eyes','Mascara is the whole look. Top and bottom, build in layers, let it go thick and a little clumpy.','3 photos · 1 clip'],
      ['Brows','Clean. Brushed up with clear gel, no fill.','1 photo'],
      ['Skin','Sheer. Spot conceal only.','1 photo'],
      ['Cheeks','Nothing.',''],
      ['Lips','Clean. Balm, then blot.','1 photo']
    ].map(([name,note,count]) => ({ name, note, count }));
    return { thumbs, areas, total: 7 };
  }
}
</script>
</body>
</html>
