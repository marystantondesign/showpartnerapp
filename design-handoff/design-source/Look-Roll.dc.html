<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Studio, camera roll</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
.lbl{font-family:Inter,system-ui,sans-serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#6E6A64;margin:0}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:10px;font-family:Inter,system-ui,sans-serif;font-size:9px;letter-spacing:.1em;color:#6E6A64;background:none;border:0}
.tabb{flex:1;min-height:44px;border:0;border-bottom:2px solid transparent;background:none;font-family:Georgia,serif;font-size:16px;color:#6E6A64}
.pill{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #CFCAC4;background:transparent;font-family:Inter,system-ui,sans-serif;font-size:12px;color:#111}
.pillon{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #111;background:#111;font-family:Inter,system-ui,sans-serif;font-size:12px;color:#fff}
.chipd{padding:5px 10px;border-radius:999px;background:rgba(17,17,17,.7);color:#F5F2EE;font-size:11px;font-family:Inter,system-ui,sans-serif}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; display: flex; flex-direction: column; background: #F5F2EE; font-family: Inter, system-ui, sans-serif; color: #111; overflow: hidden">
  <div style="flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 8px 8px; border-bottom: 1px solid #E0DDD8">
    <button style="min-height: 44px; padding: 0 10px; border: 0; background: none; font-family: Inter, system-ui, sans-serif; font-size: 14px; color: #111">Cancel</button>
    <span style="font-size: 15px; font-weight: 600">Camera roll</span>
    <button style="min-height: 44px; padding: 0 10px; border: 0; background: none; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 600; color: #111">Next (3)</button>
  </div>
  <p class="lbl" style="padding: 12px 16px 8px">Today</p>
  <div style="flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; align-content: start">
    <sc-for list="{{ grid }}" as="g" hint-placeholder-count="15">
      <button style="position: relative; aspect-ratio: 1; padding: 0; border: 0; background: #E0DDD8; overflow: hidden">
        <img src="{{ g.img }}" alt="" style="width: 100%; height: 100%; object-fit: cover; opacity: {{ g.op }}">
        <sc-if value="{{ g.dur }}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 6px; bottom: 6px; font-size: 10px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6)">{{ g.dur }}</span></sc-if>
        <span style="position: absolute; right: 6px; top: 6px; width: 24px; height: 24px; border-radius: 50%; border: 2px solid #fff; background: {{ g.cb }}; color: #fff; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{ g.n }}</span>
      </button>
    </sc-for>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const B = {"SA": "1705ea7146c2879258c52a172e2bdcbe", "ML": "92535a459422f9a2aeb42fee5cce377d", "AJ": "25da83555fcf1ca7fad82ae9a74e05c8", "AD": "2af75eeca89115daaf4090df5de1cc6c", "CD": "0145c19aa201167cced03e129ff8b0d5", "PS": "eb52f2831800e0153855e0ed84e447ed"};
    const keys = ['SA','ML','AJ','AD','CD','PS','ML','SA','AD','AJ','PS','CD','ML','AD','SA'];
    const sel = { 1: 1, 3: 2, 4: 3 };
    const dur = { 0: '4:12', 3: '0:38', 9: '1:05' };
    const grid = keys.map((k,i) => ({ img: '/_blob/' + B[k], dur: dur[i] || '', n: sel[i] || '', cb: sel[i] ? '#111' : 'rgba(17,17,17,.15)', op: sel[i] ? .7 : 1 }));
    return { grid };
  }
}
</script>
</body>
</html>
